<!-- ************************ IMPORTANT INFORMATION ************************************
  This web navigation drawer template is provided as an example of how to configure
  a JET web application with a navigation drawer as a single page application
  using ojRouter and oj-module.  It contains the Oracle JET framework and a default
  requireJS configuration file to show how JET can be setup in a common application.
  This project template can be used in conjunction with demo code from the JET
  website to test JET component behavior and interactions.

  Any CSS styling with the prefix "demo-" is for demonstration only and is not
  provided as part of the JET framework.

  Please see the demos under Cookbook/Patterns/App Shell: Web and the CSS documentation
  under Support/API Docs/Non-Component Styling on the JET website for more information on how to use
  the best practice patterns shown in this template.

  Aria Landmark role attributes are added to the different sections of the application
  for accessibility compliance. If you change the type of content for a specific
  section from what is defined, you should also change the role value for that
  section to represent the appropriate content type.
  ***************************** IMPORTANT INFORMATION ************************************ -->
<html lang="en-us">
  <head>
    <title>FinThink Bank</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1">
    <link rel="icon" href="css/images/JET-Favicon-Red-32x32.png" type="image/x-icon" />

    <!-- This is the main css file for the default theme -->
		<!-- injector:theme -->
		<!-- endinjector -->

    <!-- This contains icon fonts used by the starter template -->
		<!-- injector:font -->
		<!-- endinjector:font -->

    <!-- This is where you would add any app specific styling -->
    <link rel="stylesheet" href="css/app.css" type="text/css"/>

  </head>
  <body class="oj-web-applayout-body">
    <!-- Template for rendering navigation items shared between nav bar and nav list -->
    <script type="text/html" id="navTemplate">
      <li><a href="#">
        <span :class="[[$data.detail.iconClass]]"></span>
        <oj-bind-text value="[[$data.detail.label]]"></oj-bind-text>
      </a></li>
    </script>

    <div id="globalBody">

      <div id="announce" tabindex="-1" class="send-off-screen" :aria-live="[[manner]]" aria-atomic="true">
          <p id="ariaLiveMessage"><oj-bind-text value="[[message]]"></oj-bind-text></p>
      </div>

      <div class="finthink-drawer-scrim" style="display:none" aria-hidden="true"
           data-bind="visible: isCustomer() && sideDrawerOn() && !lgScreen(), click: toggleDrawer"></div>

      <!-- Reflow the page beside the menu on wide screens. -->
      <oj-drawer-layout id="appDrawerLayout" class="finthink-app-layout"
                        start-opened="{{sideDrawerOn}}"
                        start-display="[[lgScreen() ? 'reflow' : 'overlay']]">
        <div slot="start" class="finthink-side-panel" role="navigation" aria-label="Banking pages" data-bind="visible: isCustomer">
          <div class="finthink-side-panel-heading">
            <oj-button id="drawerCloseButton" chroming="borderless" display="icons"
                       on-oj-action="[[toggleDrawer]]" aria-label="Close menu" title="Close menu">
              <span slot="startIcon" class="oj-web-applayout-offcanvas-icon"></span>
              <span>Close menu</span>
            </oj-button>
            <span>Banking menu</span>
          </div>
          <oj-navigation-list id="navDrawerList" data="[[customerNavDataProvider]]"
                              drill-mode="collapsible"
                              item.renderer="[[KnockoutTemplateUtils.getRenderer('navTemplate', true)]]"
                              on-oj-selection-action="[[handleNavSelection]]"
                              selection="[[selection.path]]">
          </oj-navigation-list>
        </div>
      <oj-drawer-popup id="navDrawer" edge="start" opened="{{adminDrawerOn}}"
                       modality="modal" role="navigation" aria-label="Admin navigation"
                       class="admin-mobile-drawer" data-bind="visible: isAdmin">
        <oj-navigation-list id="mobileNavDrawerList" data="[[adminNavDataProvider]]"
                            item.renderer="[[KnockoutTemplateUtils.getRenderer('navTemplate', true)]]"
                            on-oj-selection-action="[[handleNavSelection]]" selection="[[selection.path]]"
                            aria-label="Admin navigation">
        </oj-navigation-list>
      </oj-drawer-popup>
      <div id="pageContent" class="oj-web-applayout-page">
        <header role="banner" class="oj-web-applayout-header">
          <div class="admin-topbar">
              <oj-button id="customerDrawerToggle" class="oj-button-lg" on-oj-action="[[toggleDrawer]]" chroming="borderless" aria-label="Banking pages" data-bind="visible: isCustomer">
                <span slot="startIcon" class="oj-web-applayout-offcanvas-icon"></span>
                <span>All pages</span>
              </oj-button>
            <div class="admin-brand">
              <span class="brand-mark" aria-hidden="true">F</span>
              <div><span class="brand-name">FinThink Bank</span><span class="brand-context">Operations</span></div>
            </div>
            <oj-button id="adminDrawerToggle" class="mobile-nav-toggle oj-md-hide" on-oj-action="[[toggleAdminDrawer]]" chroming="borderless" display="icons" aria-label="Open admin navigation" data-bind="visible: isAdmin">
              <span slot="startIcon" class="oj-web-applayout-offcanvas-icon"></span>
            </oj-button>
            <div class="admin-userbar" data-bind="visible: isAuthenticated">
              <oj-avatar class="admin-avatar" initials="[[userInitials]]" size="xs" aria-label="Administrator avatar"></oj-avatar>
              <div class="admin-identity">
                <span class="admin-user-name"><oj-bind-text value="[[userLogin]]"></oj-bind-text></span>
                <span class="admin-role-badge"><oj-bind-text value="[[userRole]]"></oj-bind-text></span>
              </div>
              <oj-menu-button id="userMenu" display="all" chroming="borderless" aria-label="Account menu">
                Account
                <oj-menu id="userMenuOptions" slot="menu" on-oj-menu-action="[[handleUserMenuAction]]">
                  <oj-option id="resetPassword" value="resetPassword">Reset Password</oj-option>
  <oj-option id="out" value="out">Sign out</oj-option>
                </oj-menu>
              </oj-menu-button>
              <oj-button id="logoutButton" on-oj-action="[[handleLogout]]" chroming="outlined" aria-label="Sign out">Sign out</oj-button>
            </div>
          </div>
        </header>

        <div class="admin-workspace" data-bind="css: { 'admin-workspace-public': !isAdmin() }">
          <aside class="admin-sidebar" data-bind="visible: isAdmin" aria-label="Primary navigation">
            <p class="sidebar-label">WORKSPACE</p>
            <oj-navigation-list id="adminNavigation" data="[[adminNavDataProvider]]"
              item.renderer="[[KnockoutTemplateUtils.getRenderer('navTemplate', true)]]"
              on-oj-selection-action="[[handleNavSelection]]"
              selection="[[selection.path]]" aria-label="Admin navigation">
            </oj-navigation-list>
          </aside>
          <main class="admin-main">
            <div class="access-denied-banner" role="alert" data-bind="visible: accessDeniedMessage">
              <span><oj-bind-text value="[[accessDeniedMessage]]"></oj-bind-text></span>
              <oj-button chroming="borderless" display="icons" on-oj-action="[[dismissAccessDenied]]" aria-label="Dismiss access denied message">
                <span slot="startIcon" class="oj-ux-ico-close" aria-hidden="true"></span>
              </oj-button>
            </div>
            <oj-module role="main" class="oj-web-applayout-content" config="[[moduleAdapter.koObservableConfig]]">
            </oj-module>
          </main>
        </div>
        <footer class="admin-footer" role="contentinfo">
          <span>FinThink Bank</span><span>© 2026</span>
        </footer>
      </div>
      </oj-drawer-layout>
    </div>

    <!-- This injects script tags for the main javascript files -->
		<!-- injector:scripts -->
		<!-- endinjector -->

  </body>

</html>
