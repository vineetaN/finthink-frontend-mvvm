<div class="dashboard-page rewards-page rewards-wallet-page">
  <section class="dashboard-intro rewards-wallet-intro">
    <div class="rewards-wallet-intro-copy">
      <p class="dashboard-eyebrow">YOUR REWARDS WALLET</p>
      <h1>Every point<br>has a story.</h1>
      <p>Follow the points you earn, use, and keep for what comes next.</p>
    </div>
    <div class="rewards-wallet-intro-stat" aria-label="Available reward points">
      <span class="rewards-wallet-stat-label">AVAILABLE POINTS</span>
      <strong data-bind="text: availablePoints().toLocaleString('en-IN')"></strong>
      <oj-button class="rewards-points-action" chroming="solid" on-oj-action="[[goToRewards]]">Explore rewards</oj-button>
      <small data-bind="text: entries().length.toLocaleString('en-IN') + ' transactions · ' + redeemedCount().toLocaleString('en-IN') + ' redemptions'"></small>
    </div>
  </section>

  <section class="rewards-content" aria-label="Rewards wallet">
    <div class="customer-summary-state" data-bind="visible: isLoading" role="status">
      <oj-progress-circle size="sm" value="-1" aria-label="Loading wallet"></oj-progress-circle>
      Loading wallet…
    </div>
    <div class="customer-summary-state customer-summary-error" data-bind="visible: errorMessage" role="alert">
      <oj-bind-text value="[[errorMessage]]"></oj-bind-text>
      <oj-button chroming="borderless" on-oj-action="[[load]]">Try again</oj-button>
    </div>

    <div id="wallet-history-heading" class="customer-summary-heading reveal-target">
      <p class="dashboard-eyebrow">ACTIVITY</p>
      <h2>Points history</h2>
    </div>
    <div class="rewards-history" data-bind="foreach: visibleEntries">
      <article class="summary-card reward-history-row">
        <div class="reward-history-main">
          <p class="reward-history-kind" data-bind="text: pointsType, css: { 'reward-history-kind-redeemed': $parent.isNegativePoints($data) }"></p>
          <h3 data-bind="text: rewardName || description || 'Points activity'"></h3>
          <!-- ko if: rewardId != null -->
          <div class="reward-history-meta">
            <span class="reward-history-type" data-bind="text: $parent.rewardTypeLabel($data)"></span>
            <span class="reward-history-id" data-bind="text: 'Reward ID #' + rewardId"></span>
          </div>
          <!-- /ko -->
          <p class="summary-account" data-bind="text: $parent.formatDate(createdAt)"></p>
          <p class="summary-account" data-bind="visible: expiryDate, text: 'Expires ' + $parent.formatDate(expiryDate)"></p>
        </div>
        <div class="reward-history-values">
          <strong data-bind="text: $parent.pointsLabel($data), css: { 'reward-negative': $parent.isNegativePoints($data) }"></strong>
          <span data-bind="text: $parent.balanceAfterLabel($data)"></span>
        </div>
      </article>
    </div>
    <nav class="wallet-pagination" aria-label="Points history pages" data-bind="visible: pageCount() > 1">
      <p data-bind="text: 'Showing ' + firstEntryNumber() + '–' + lastEntryNumber() + ' of ' + entries().length + ' transactions'"></p>
      <div class="wallet-pagination-controls">
        <button type="button" data-bind="click: previousPage, disable: currentPage() === 1" aria-label="Previous page">Previous</button>
        <div class="wallet-pagination-pages" data-bind="foreach: pageNumbers">
          <button type="button" data-bind="text: $data, click: $parent.changePage.bind($parent, $data), css: { 'is-current': $data === $parent.currentPage() }, attr: { 'aria-label': 'Page ' + $data, 'aria-current': $data === $parent.currentPage() ? 'page' : null }"></button>
        </div>
        <button type="button" data-bind="click: nextPage, disable: currentPage() === pageCount()" aria-label="Next page">Next</button>
      </div>
    </nav>
    <p class="customer-summary-state" data-bind="visible: !isLoading() && entries().length === 0 && !errorMessage()">No points activity yet. Eligible card and bill payments will appear here.</p>
  </section>
</div>
