<div class="admin-overview">
  <header class="overview-heading">
    <div>
      <p class="admin-eyebrow">ADMINISTRATION / OVERVIEW</p>
      <h1>Welcome, <oj-bind-text value="[[adminName]]"></oj-bind-text></h1>
      <p class="overview-subtitle">Your banking operations, at a glance.</p>
    </div>
    <span class="overview-date"><span class="oj-ux-ico-calendar" aria-hidden="true"></span> Operations dashboard</span>
  </header>

  <section class="module-grid" aria-label="Administration modules">
    <oj-bind-for-each data="[[moduleCards]]">
      <template>
        <oj-button class="module-tile" :class="[[$current.data.accent]]" chroming="borderless" on-oj-action="[[$current.data.navigate]]" :aria-label="[['Open ' + $current.data.title]]">
          <span class="module-tile-content">
            <span class="module-tile-top">
              <span class="module-tile-icon" aria-hidden="true"><span :class="[[$current.data.icon]]"></span></span>
              <span class="module-tile-arrow oj-ux-ico-arrow-up-right" aria-hidden="true"></span>
            </span>
            <span class="module-tile-title"><oj-bind-text value="[[$current.data.title]]"></oj-bind-text></span>
            <oj-bind-if test="[[$current.data.loading()]]"><span class="module-tile-value module-tile-loading">Loading</span></oj-bind-if>
            <oj-bind-if test="[[$current.data.error()]]"><span class="module-tile-value metric-error">Unavailable</span></oj-bind-if>
            <oj-bind-if test="[[$current.data.loading() === false && !$current.data.error()]]">
              <span class="module-tile-value"><strong><oj-bind-text value="[[$current.data.value]]"></oj-bind-text></strong><span><oj-bind-text value="[[$current.data.note]]"></oj-bind-text></span></span>
            </oj-bind-if>
          </span>
        </oj-button>
      </template>
    </oj-bind-for-each>
  </section>

  <section class="overview-lower" aria-label="Operational activity">
    <article class="overview-panel chart-panel" aria-label="Loans by status chart">
      <div class="panel-heading">
        <div><p class="admin-eyebrow">PORTFOLIO</p><h2>Loans by status</h2></div>
        <span class="panel-period">Current</span>
      </div>
      <oj-bind-if test="[[chartLoading()]]"><p class="panel-state" role="status">Loading chart...</p></oj-bind-if>
      <oj-bind-if test="[[chartError()]]"><p class="panel-state metric-error" role="alert"><oj-bind-text value="[[chartError]]"></oj-bind-text></p></oj-bind-if>
      <oj-bind-if test="[[chartLoading() === false && !chartError()]]">
        <oj-chart type="bar" data="[[chartDataProvider]]" groups="[[chartGroups]]"
          animation-on-display="auto" animation-on-data-change="auto"
          aria-label="Loans by status" class="loans-chart">
          <template slot="itemTemplate" data-oj-as="item">
            <oj-chart-item value="[[item.data.value]]" group-id="[[item.data.group]]"
              series-id="[[item.data.series]]"></oj-chart-item>
          </template>
        </oj-chart>
      </oj-bind-if>
    </article>

    <article class="overview-panel audit-panel" aria-label="Recent audit events">
      <div class="panel-heading">
        <div><p class="admin-eyebrow">CONTROL ACTIVITY</p><h2>Recent Audit Events</h2></div>
        <span class="audit-count"><oj-bind-text value="[[auditCount]]"></oj-bind-text> recent</span>
      </div>
      <oj-bind-if test="[[auditLoading()]]"><p class="panel-state" role="status">Loading events...</p></oj-bind-if>
      <oj-bind-if test="[[auditError()]]"><p class="panel-state metric-error" role="alert"><oj-bind-text value="[[auditError]]"></oj-bind-text></p></oj-bind-if>
      <ol class="audit-list" aria-label="Last five audit events">
        <oj-bind-for-each data="[[auditEvents]]">
          <template>
            <li class="audit-item">
              <span class="audit-type"><oj-bind-text value="[[$current.data.type]]"></oj-bind-text></span>
              <div class="audit-detail">
                <strong><oj-bind-text value="[[$current.data.action]]"></oj-bind-text></strong>
                <span><oj-bind-text value="[[$current.data.actor]]"></oj-bind-text></span>
              </div>
              <time><oj-bind-text value="[[$current.data.time]]"></oj-bind-text></time>
            </li>
          </template>
        </oj-bind-for-each>
      </ol>
    </article>
  </section>
</div>
