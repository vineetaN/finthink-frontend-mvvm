<section class="reward-page" aria-labelledby="rewardPageTitle">
  <header class="reward-heading">
    <div><p class="admin-eyebrow">ADMINISTRATION</p><h1 id="rewardPageTitle">Reward Management</h1><p class="reward-subtitle">Create and manage customer rewards.</p></div>
    <div class="reward-heading-actions"><oj-button on-oj-action="[[refresh]]" chroming="outlined"><span slot="startIcon" class="oj-ux-ico-refresh" aria-hidden="true"></span>Refresh</oj-button><oj-button on-oj-action="[[create]]" chroming="callToAction">Create Reward</oj-button></div>
  </header>
  <div class="reward-filters" role="search" aria-label="Filter rewards">
    <div><oj-label for="rewardSearch">Search reward name</oj-label><oj-input-text id="rewardSearch" value="{{search}}" clear-icon="conditional"></oj-input-text></div>
    <div><oj-label for="rewardTypeFilter">Reward type</oj-label><oj-select-single id="rewardTypeFilter" data="[[typeOptions]]" value="{{typeFilter}}"></oj-select-single></div>
    <div><oj-label for="rewardStatusFilter">Status</oj-label><oj-select-single id="rewardStatusFilter" data="[[statusOptions]]" value="{{statusFilter}}"></oj-select-single></div>
  </div>
  <div class="reward-results-heading"><p><oj-bind-text value="[[showingText]]"></oj-bind-text></p></div>
  <div class="reward-live" role="status" aria-live="polite"><oj-bind-text value="[[liveMessage]]"></oj-bind-text></div>
  <oj-bind-if test="[[loading()]]"><div class="reward-skeleton-row" role="status" aria-label="Loading rewards"><div class="reward-skeleton"></div><div class="reward-skeleton"></div><div class="reward-skeleton"></div></div></oj-bind-if>
  <oj-bind-if test="[[error()]]"><div class="reward-state" role="alert"><p><oj-bind-text value="[[error]]"></oj-bind-text></p><oj-button on-oj-action="[[refresh]]">Retry</oj-button></div></oj-bind-if>
  <oj-bind-if test="[[!loading() && !error() && rewards().length === 0]]"><div class="reward-state">No rewards yet. Create the first one.</div></oj-bind-if>
  <oj-bind-if test="[[!loading() && !error() && rewards().length > 0 && filteredRewards().length === 0]]"><div class="reward-state">No rewards match the filters.</div></oj-bind-if>
  <div id="rewardCardRow" class="reward-card-row" tabindex="0" role="region" aria-label="Rewards, vertically scrollable" data-bind="visible: !loading() && !error() && filteredRewards().length > 0">
    <oj-bind-for-each data="[[filteredRewards]]"><template><div data-bind="component: { name: 'reward-card', params: { reward: $current.data, busy: busyFor($current.data.rewardId), currency: currency, onEdit: edit, onStatus: askStatus } }"></div></template></oj-bind-for-each>
  </div>
  <reward-form params="model: form"></reward-form>
  <oj-dialog id="rewardConfirmDialog" dialog-title="Confirm status change" modality="modal" on-oj-close="[[confirmClosed]]">
    <div slot="body"><p><oj-bind-text value="[[confirmMessage]]"></oj-bind-text></p></div>
    <div slot="footer" class="reward-dialog-actions"><oj-button on-oj-action="[[closeConfirm]]" chroming="borderless">Cancel</oj-button><oj-button id="rewardConfirmButton" on-oj-action="[[applyStatus]]" chroming="callToAction">Confirm</oj-button></div>
  </oj-dialog>
  <div class="reward-toast" role="status" aria-live="polite" data-bind="visible: toast, text: toast"></div>
</section>
